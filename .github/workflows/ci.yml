name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "presentations/**"
      - "contracts/**"
      - "assets/**"
      - "*.zip"
      - "*.MOV"
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BHC_SCHEDULER: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Automation engine smoke (seeded store)
        run: |
          npm run bhc -- store health
          npm run bhc -- automations tick -- --force
          npm run bhc -- automations status
