# Apache reverse proxy for BHC (Next.js on 127.0.0.1:3000)
# Install: sudo cp deploy/gcp/vm/apache-bhc.conf /etc/apache2/sites-available/bhc.conf
#          sudo a2enmod proxy proxy_http proxy_wstunnel headers rewrite ssl
#          sudo a2ensite bhc && sudo a2dissite 000-default
#          sudo systemctl reload apache2
#
# Replace SERVER_NAME below after DNS is pointed, then run post-dns-https.sh

<VirtualHost *:80>
    ServerName _default_
    # After DNS: ServerName ops.bhcontracting.co
    # After DNS: ServerAlias www.ops.bhcontracting.co

    ServerAdmin bhcontractingadmin@gmail.com
    DocumentRoot /var/www/html

    ErrorLog ${APACHE_LOG_DIR}/bhc-error.log
    CustomLog ${APACHE_LOG_DIR}/bhc-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    # Next.js needs correct forwarded headers behind TLS terminator / Apache
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port "80"

    # WebSocket / upgrade (Next dev; harmless in prod)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3000/$1 [P,L]

    ProxyPass / http://127.0.0.1:3000/ connectiontimeout=5 timeout=300
    ProxyPassReverse / http://127.0.0.1:3000/

    # Large uploads (progress photos, proposals)
    LimitRequestBody 52428800
</VirtualHost>

