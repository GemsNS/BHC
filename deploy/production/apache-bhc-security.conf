# BHC reverse-proxy security hardening for Apache (bhcontracting.ca).
#
# Install (once on the host):
#   sudo bash deploy/production/install-apache-security.sh
#
# Requires: mod_headers, mod_ssl (usual on Ubuntu). Reload apache2 after install.
#
# Goals:
#   - Strip / minimize Server and X-Powered-By version disclosure
#   - Mirror HSTS / XCTO / CSP / frame guards if Next is bypassed or cached oddly
#   - Keep ProxyPass to Node (127.0.0.1:3000) unchanged — include this from your vhost

# Global (safe even when included from a vhost)
ServerTokens Prod
ServerSignature Off

<IfModule mod_headers.c>
  # Next also sets these via next.config.ts; Apache ensures they survive caching/proxy.
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()"
  # Prefer Next's CSP when present; unset empty then set a sane default only if missing.
  Header always unset X-Powered-By
  Header unset X-Powered-By
  # Do not advertise Apache version beyond ServerTokens Prod ("Apache").
  Header always unset X-AspNet-Version
  Header always unset X-AspNetMvc-Version
</IfModule>
