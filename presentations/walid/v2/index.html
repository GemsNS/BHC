<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>BH Contracting Ltd. — Walid Two-Tone (Oreo) Model</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root {
      --ink: #14181e;
      --muted: #5c6570;
      --panel: #f2efe9;
      --line: #d2cdc4;
      --charcoal: #2c3038;
      --cream: #f4efe6;
      --accent: #9a6a3a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 70% 10%, rgba(154, 106, 58, 0.12), transparent 60%),
        linear-gradient(160deg, #ebe7e0 0%, #d9d4cb 100%);
      font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .shell {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      padding: 22px 28px 18px;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 92%, white);
    }
    .brand {
      border-left: 6px solid var(--charcoal);
      padding-left: 14px;
    }
    .eyebrow {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(22px, 3vw, 34px);
      letter-spacing: -0.03em;
      line-height: 1.05;
    }
    .lede {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      max-width: 46ch;
      line-height: 1.5;
    }
    .swatches {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .swatch {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
    }
    .swatch.charcoal { background: var(--charcoal); }
    .swatch.cream { background: var(--cream); }
    .swatch-label {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
    }
    main {
      min-height: 0;
      padding: 12px;
    }
    model-viewer {
      width: 100%;
      height: calc(100vh - 140px);
      min-height: 420px;
      background: linear-gradient(180deg, #f7f4ef 0%, #ddd8cf 100%);
      border: 1px solid var(--line);
    }
    .hint {
      margin: 10px 4px 0;
      color: var(--muted);
      font-size: 12px;
    }
    @media (max-width: 720px) {
      header { padding: 16px; }
      model-viewer { height: calc(100vh - 200px); }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand">
        <p class="eyebrow">BH Contracting Ltd.</p>
        <h1>Walid two-tone · Oreo</h1>
        <p class="lede">Standalone charcoal + cream exterior model for 9 Alicia Scott Ave., Mount Uniacke. Drag to orbit · scroll to zoom.</p>
      </div>
      <div class="swatches" aria-label="Facade colours">
        <span class="swatch charcoal" title="Charcoal"></span>
        <span class="swatch cream" title="Cream"></span>
        <span class="swatch-label">Charcoal field<br />Cream accent</span>
      </div>
    </header>
    <main>
      <model-viewer
        id="viewer"
        src="./Walid_Two_Tone_Standalone_Model_Oreo.glb"
        alt="Walid warehouse two-tone Oreo exterior model"
        camera-controls
        touch-action="pan-y"
        shadow-intensity="1.1"
        shadow-softness="0.8"
        exposure="1.05"
        environment-image="neutral"
        interaction-prompt="auto"
        camera-orbit="35deg 62deg 52m"
        min-camera-orbit="auto 28deg auto"
        max-camera-orbit="auto 88deg auto"
        auto-rotate
        auto-rotate-delay="4000"
        rotation-per-second="12deg"
      ></model-viewer>
      <p class="hint">File: Walid_Two_Tone_Standalone_Model_Oreo.glb · public link (no password)</p>
    </main>
  </div>
</body>
</html>
